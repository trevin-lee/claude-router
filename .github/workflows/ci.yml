name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os != 'windows-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The end-to-end tests use a shell-script fake claude, so they skip on Windows;
      # the Windows job still builds and runs the unit tests.
      - if: matrix.os != 'windows-latest'
        run: go test -race ./...
      - if: matrix.os == 'windows-latest'
        run: go test ./...
